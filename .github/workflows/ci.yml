name: ci

on:
  push:
  pull_request:
  schedule: [cron: "40 8 * * *"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # checklinks:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4

  #     - uses: trevyn/lychee-action@v1
  #       id: lychee
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #       with:
  #         args: --verbose --no-progress --header="accept=text/html" "**/*.md" "**/*.rs" "**/*.json" "**/*.toml" "**/*.yml"

  #     - name: Fail if there were link-check errors
  #       run: exit ${{ steps.lychee.outputs.exit_code }}

  test:
    name: test ${{ matrix.os }} rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ["1.82", stable, beta, nightly]

    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: ${{ matrix.os == 'windows-latest' }}
        with:
          arch: x64

      - name: Install WinFsp
        if: ${{ matrix.os == 'windows-latest' }}
        run: choco install winfsp -y --no-progress

      - name: Set WinFsp include
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\WinFsp\inc\fuse",
            "C:\Program Files\WinFsp\inc\fuse"
          )
          $selected = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $selected) { throw "WinFsp fuse headers not found." }
          "LIBRCLONE_WINFSP_INCLUDE=$selected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          check-latest: true
          cache: false
      - run: go version

      - run: rustup default ${{ matrix.rust }} && rustup update ${{ matrix.rust }}

      - run: go mod vendor
        working-directory: "librclone-sys"

      - run: cargo test -- --nocapture

      - run: cargo test -- --nocapture
        working-directory: "librclone-sys"

      - run: cargo doc --no-deps

      - name: dry-run cargo package librclone-sys
        run: cargo package --allow-dirty --no-verify
        working-directory: "librclone-sys"

      - name: dry-run cargo package librclone
        # this looks for librclone-sys on crates.io, so will fail if we're publish-ready with a new version number
        if: ${{ !contains(github.event.head_commit.message, 'librclone@') }}
        run: cargo package --no-verify

  publish:
    needs: [test]
    runs-on: ubuntu-latest
    if: ${{ contains(github.event.head_commit.message, 'librclone@') && github.event_name == 'push' && github.ref == 'refs/heads/master' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          check-latest: true
          cache: false
      - run: go version

      - run: rustup default stable && rustup update stable

      - run: go mod vendor
        working-directory: "librclone-sys"

      - name: cargo publish librclone-sys
        run: cargo publish --allow-dirty --no-verify --token ${{ secrets.CARGO_TOKEN }}
        working-directory: "librclone-sys"

      - name: cargo publish librclone
        run: cargo publish --no-verify --token ${{ secrets.CARGO_TOKEN }}
